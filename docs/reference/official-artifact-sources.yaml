      implementation-code URL.
    has_official_implementation_code_link: false
    implementation_code_status: coming_soon
    has_official_project_page_link: true
    has_supplementary_video_url: true
    supplementary_video_url: "https://www.youtube-nocookie.com/embed/xnLCdUfq52w?rel=0"

  - source_id: first_author_github_mabd_repo
    source_type: official_project_page_repository
    official: true
    url: "https://api.github.com/repos/MINSUGLLY/mabd"
    evidence_locator: "GitHub REST repository, contents, and languages API stdout"
    observation: >-
      The public first-author repository MINSUGLLY/mabd exists and has GitHub
      Pages enabled. The audited repository contents are index.html and static,
      and the GitHub languages API reports HTML only, so this is recorded as
      project-page source rather than released implementation code.
    repository_url: "https://github.com/MINSUGLLY/mabd"
    repository_language: "HTML"
    root_contents:
      - index.html
      - static
    has_pages: true
    has_official_implementation_code_link: false
    implementation_code_status: project_page_source_only
    has_official_project_page_link: true
    has_supplementary_video_url: false

  - source_id: yin_yang_author_page
    source_type: official_author_page
    official: true
    url: "https://yangzzzy.github.io/"
    evidence_locator: "browser lines 34-37"
    observation: >-
      The author page lists the M-ABD title, authors, and SIGGRAPH 2026 venue.
      No implementation-code URL is present near the audited M-ABD entry text.
    has_official_implementation_code_link: false
    has_official_project_page_link: false
    has_supplementary_video_url: false

  - source_id: paper_tex_source_tree
    source_type: official_arxiv_source
    official: true
    url: "https://arxiv.org/e-print/2603.08079"
    local_source_root: "/tmp/mabd-paper/source"
    evidence_locator: "sections/experiment.tex:38; rg over arxiv.tex, sections/*.tex, sections_a/*.tex, ref.bib"
    observation: >-
      The paper TeX mentions that additional animation results are in the
      supplementary video, but the audited TeX source tree does not contain an
      implementation-code URL or supplementary-video URL. The public project
      page separately provides the video.
    mentions_supplementary_video: true
    has_official_implementation_code_link: false
    has_official_project_page_link: false
    has_supplementary_video_url: false

  - source_id: github_repository_exact_search
    source_type: public_repository_index_search
    official: false
    url: "https://api.github.com/search/repositories?q=%22M-ABD%22%20%22Scalable%20Efficient%20Robust%20Multi-Affine-Body%20Dynamics%22"
    evidence_locator: "GitHub REST repository search stdout"
    observation: >-
      Exact public GitHub repository search returned total_count 0 with
      incomplete_results false. This narrow public-index search does not
      supersede the separately audited first-author MINSUGLLY/mabd project-page
      repository.
    observed_total_count: 0
    incomplete_results: false
    has_official_implementation_code_link: false
    has_official_project_page_link: false
    has_supplementary_video_url: false

search_queries:
  - '"Scalable, Efficient, and Robust Multi-Affine-Body Dynamics" code'
  - '"M-ABD" "Multi-Affine-Body Dynamics" GitHub'
  - '"2603.08079" "code"'
  - '"Scalable, Efficient, and Robust Multi-Affine-Body Dynamics" supplementary'
  - 'site:github.com "M-ABD" "Scalable, Efficient, and Robust"'
  - '"M-ABD" "supplementary video" "Multi-Affine-Body"'

non_claims:
  - This audit is not proof of private author-code absence.
  - This audit is not proof of unpublished implementation-code absence.
  - This audit does not pass any paper experiment claim.
  - This audit does not modify or verify Newton solver behavior.
