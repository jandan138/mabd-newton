    evidence_locator: "browser lines 23-28 and 76-84"
    observation: >-
      The SIGGRAPH 2026 schedule page lists the M-ABD presentation, session,
      authors, event type, time, and location. No implementation code URL is
      present in the audited page text.
    has_official_implementation_code_link: false
    has_official_project_page_link: false
    has_supplementary_video_url: false

  - source_id: minghao_guo_author_page
    source_type: official_author_page
    official: true
