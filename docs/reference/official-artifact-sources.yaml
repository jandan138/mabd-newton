audit:
  id: phase31-official-artifact-availability
  audited_on_utc: "2026-05-17"
  status: official_project_and_video_found_implementation_code_coming_soon_as_of_2026-05-17
  scope_boundary: >-
    Public-source availability audit only; not proof of private author-code
    absence, not proof of unpublished implementation-code absence, and not
    evidence that any paper experiment is reproduced. The official first-author
    project page and video were found; implementation code is marked coming
    soon on the audited project page.
  blockers:
    - official_implementation_code_marked_coming_soon
    - official_implementation_code_not_found_in_audited_public_sources

paper:
  title: "M-ABD: Scalable, Efficient, and Robust Multi-Affine-Body Dynamics"
  arxiv_id: "2603.08079"
  arxiv_version: "v2"
  conference_schedule_id: "papers_116"
  conference_session_id: "sess102"

audited_sources:
  - source_id: arxiv_abs_2603_08079
    source_type: official_paper_index
    official: true
    url: "https://arxiv.org/abs/2603.08079"
    evidence_locator: "browser lines 28-64 and 118-127"
    observation: >-
      The arXiv page lists v2, authors, PDF, HTML, and TeX Source links. The
      audited page text did not expose an author-provided implementation code
      link.
    has_official_implementation_code_link: false
    has_official_project_page_link: false
    has_supplementary_video_url: false

  - source_id: siggraph_2026_schedule_papers_116
